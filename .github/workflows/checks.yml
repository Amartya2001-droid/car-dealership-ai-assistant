name: App checks
on:
  push:
    branches: [master, codex/web-android-app]
  pull_request:
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run demo:setup
      - run: npm run build:site
      - run: node scripts/demo-smoke.mjs
